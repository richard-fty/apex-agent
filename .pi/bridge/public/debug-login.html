<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>管理员登录 · Apex Debug</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #181816;
        background: #fbfbfa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fbfbfa;
      }

      main {
        width: min(100%, 360px);
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 24px;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .brand img {
        width: 34px;
        height: 34px;
        object-fit: contain;
      }

      .panel {
        padding: 28px;
        border: 1px solid #e8e8e5;
        border-radius: 16px;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.03em;
        text-align: center;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 7px;
        font-size: 13px;
        font-weight: 550;
        color: #4b4b47;
      }

      input {
        width: 100%;
        height: 44px;
        padding: 0 12px;
        border: 1px solid #dcdcd8;
        border-radius: 10px;
        outline: none;
        background: #ffffff;
        color: #181816;
        font: inherit;
        transition:
          border-color 120ms ease,
          box-shadow 120ms ease;
      }

      input:focus {
        border-color: #8a8a84;
        box-shadow: 0 0 0 3px rgba(24, 24, 22, 0.07);
      }

      button {
        height: 44px;
        margin-top: 4px;
        border: 0;
        border-radius: 10px;
        background: #181816;
        color: #ffffff;
        font: inherit;
        font-size: 14px;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover {
        background: #2d2d2a;
      }

      .error {
        display: none;
        margin: -2px 0 0;
        color: #b42318;
        font-size: 13px;
        text-align: center;
      }

      .error.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/apex-cat-logo.png" alt="" />
        <span>Apex Debug</span>
      </div>

      <section class="panel">
        <h1>管理员登录</h1>

        <form action="/debug/login" method="post">
          <label>
            用户名
            <input
              name="username"
              type="text"
              autocomplete="username"
              required
              autofocus
            />
          </label>

          <label>
            密码
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>

          <p class="error" id="login-error">用户名或密码不正确</p>
          <button type="submit">登录</button>
        </form>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      if (params.has("error")) {
        document.querySelector("#login-error")?.classList.add("visible");
      }
    </script>
  </body>
</html>
